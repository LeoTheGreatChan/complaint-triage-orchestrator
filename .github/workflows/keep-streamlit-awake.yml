name: Keep Streamlit app awake

# Streamlit Community Cloud puts apps to sleep after a period of no
# incoming traffic. A periodic real visit to the app's own URL counts as
# traffic and resets that timer -- this is not exercising the dashboard's
# logic, just keeping the hosted app from sleeping.
#
# Uses a real headless browser (Playwright), not a plain curl request --
# curl loops into a redirect chain against share.streamlit.io's auth
# gateway and fails (exit 47, max redirects), confirmed by testing both
# directly. See .github/scripts/ping-dashboard.js for the full story.
on:
  schedule:
    - cron: "0 */5 * * *" # every 5 hours -- public repo, Actions minutes are unlimited/free
  workflow_dispatch: {} # allows a manual "Run workflow" click too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Visit the live dashboard with a real browser
        run: node .github/scripts/ping-dashboard.js
